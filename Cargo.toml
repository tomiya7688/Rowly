[package]
name = "rowly"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A CSV-first table viewer and editor"
license = "Apache-2.0"

[dependencies]
chardetng = "0.1"
csv = "1.3"
encoding_rs = "0.8"
mlua = { version = "0.11", features = ["luau", "vendored"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
