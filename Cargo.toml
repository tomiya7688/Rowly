[package]
name = "rowly"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A CSV-first table viewer and editor"
default-run = "rowly"

[features]
default = []
gui = ["dep:eframe"]

[[bin]]
name = "rowly-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[dependencies]
chardetng = "0.1"
csv = "1.3"
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
encoding_rs = "0.8"
mlua = { version = "0.11", features = ["luau", "vendored"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
